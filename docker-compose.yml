services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    networks:
      - app-network

  nextcloud:
    image: kefaslungu/hng-nextcloud
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - nextcloud-data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=34.31.206.191 34.31.206.191:8080 localhost

  detector:
    build: ./detector
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - app-network
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
    cap_add:
      - NET_ADMIN
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}

volumes:
  HNG-nginx-logs:
    driver: local
  nextcloud-data:
    driver: local

networks:
  app-network:
    driver: bridge
